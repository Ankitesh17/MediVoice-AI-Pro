name: CI

on:
  push:
    branches: [main]
  pull_request:

# Note: this CI runs the parts that don't need heavy local runtimes. The voice
# pipeline depends on Ollama, local Whisper/Piper models, and (optionally) cloud
# API keys, which aren't available on CI runners — so we lint, type-check, and
# build everything, and run the backend tests (which stub all providers, so they
# need no models, network, or keys). The end-to-end voice path is verified
# locally.

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Set up Python
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --group dev
      - name: Lint (ruff)
        run: uv run ruff check .
      - name: Type-check (mypy)
        run: uv run mypy app
      - name: Test (pytest)
        run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint (eslint)
        run: npm run lint
      - name: Type-check (tsc)
        run: npm run typecheck
      - name: Build
        run: npm run build
