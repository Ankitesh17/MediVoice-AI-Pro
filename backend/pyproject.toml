[project]
name = "realtime-voice-agent-demo-backend"
version = "0.1.0"
description = "Realtime voice AI assistant backend — FastAPI WebSocket hub, STT/TTS adapters, state machine"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "websockets>=13",
    "numpy>=2.1",
    "faster-whisper>=1.1",
    "deepgram-sdk>=3.7",
    "openai>=1.54",
    "anthropic>=0.69",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "piper-tts>=1.4.2",
    "faiss-cpu>=1.16.0",
    "sentence-transformers>=6.3.0",
    "pypdf>=7.1.0",
]

[dependency-groups]
dev = [
    "ruff>=0.7",
    "mypy>=1.13",
    "pytest>=8",
    "httpx>=0.27",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
